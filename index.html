<style>:root{--bg:#F4F0E8;--card:#FDFBF6;--ink:#25304A;--sub:#6B7285;--tag:#EAE4D6;--line:#E4DDCF;--acc:#8A5A2B;--acc2:#B9894F;--red:#A0452E;--redbg:#F6E3DE;--ok:#3F7A4F;--okbg:#E2EFE3;--hl:#FBE7A6;--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:var(--fs);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-size:1.05em;margin:0;flex:1;line-height:1.35}
.back{border:0;background:var(--tag);border-radius:12px;padding:6px 12px;cursor:pointer}
.hero{padding:22px 0 8px}
.hero h1{font-size:1.5em;margin:0 0 4px;letter-spacing:.02em}
.hero p{margin:0;color:var(--sub);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(60,40,10,.04)}
.row{display:flex;align-items:center;gap:14px}
.badge{flex:none;width:56px;height:56px;border-radius:16px;background:var(--tag);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;color:var(--sub)}
.badge.done{background:var(--okbg);color:var(--ok)}
.grow{flex:1;min-width:0}
.ttl{font-weight:700;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--tag);border-radius:999px;padding:2px 12px;font-size:.78em}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.red{background:var(--redbg);color:var(--red)}
.bar{height:8px;background:var(--tag);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:8px}
.muted{color:var(--sub);font-size:.88em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:84px}
.tile b{display:block;margin-bottom:2px}
.tile span{font-size:.8em;color:var(--sub)}
.tabs{display:flex;gap:6px;background:var(--tag);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.9em}
.tabs button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.doc h2{font-size:1.2em;margin:28px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.doc h3{font-size:1.05em;margin:20px 0 8px;color:var(--acc)}
.doc p,.doc li{margin:0 0 12px}
.rd{border-radius:8px;transition:background .2s;cursor:pointer}
.rd.hl{background:var(--hl)}
.rd.spk{outline:2px solid var(--acc2);background:#FFF4DC}
.note{background:#F1ECE1;border-left:3px solid var(--acc2);padding:6px 10px;margin:-6px 0 12px;font-size:.85em;border-radius:6px;white-space:pre-wrap}
.tw{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:.86em;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--tag)}
.info{display:grid;grid-template-columns:6.5em 1fr;gap:6px 10px;font-size:.9em}
.info b{color:var(--sub);font-weight:600}
.btn{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--tag);color:var(--ink)}
.btn.warn{background:var(--red)}
.btn[disabled]{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.opt.pick{border-color:var(--acc2);background:#FFF6E6}
.opt.best{border-color:var(--ok);background:var(--okbg)}
.opt small{display:block;color:var(--sub);margin-top:4px}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.ck input{width:22px;height:22px;flex:none;margin-top:4px;accent-color:var(--acc)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;margin:4px 0 10px}
textarea{min-height:76px;resize:vertical}
.fl{font-size:.85em;color:var(--sub);display:block}
#sheet{position:fixed;inset:0;background:rgba(20,20,30,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .pan{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.85em;display:none;z-index:30}
#spkbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;display:none;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:10px}
#spkbar.on{display:flex}
#spkbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.chat{max-height:52vh;overflow:auto;margin:10px 0}
.msg{padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;font-size:.92em}
.msg.u{background:var(--tag);margin-left:18%}
.msg.a{background:#fff;border:1px solid var(--line);margin-right:8%}
.lock{min-height:90vh;display:flex;flex-direction:column;justify-content:center}
.warnbox{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;font-size:.85em;margin:8px 0}
.okbox{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:.9em;margin:8px 0}
.cert{text-align:center;border:3px double var(--acc2);padding:28px 18px;background:#FFFDF8}
.cert h2{margin:6px 0;font-size:1.4em}
svg text{font-family:inherit}
@media print{.top,.btns,#spkbar{display:none}body{background:#fff}}
:root{--surface:var(--card);--sunk:#F1ECE1;--muted:var(--sub);--accent:#1F4E6B;--accent-soft:rgba(31,78,107,.10);--red-soft:rgba(160,69,46,.10);--crit:#B4561C;
--hl-gold:#F5E6C4;--hl-green:#DDEFD9;--hl-blue:#DCE7F7;--hl-pink:#FADDE4;--hl-purple:#E8DEF4;--hl-maroon:#F0DADA;--hl-brown:#EEE1CD;--hl-charcoal:#E3E2DE;--reading:#D6E3F7;--serif:"Noto Serif TC","PMingLiU","Songti TC",serif}
#doc .sent{cursor:pointer;border-radius:2px}
.sent[data-hl]{background:linear-gradient(transparent 55%,var(--hl-gold) 55%)}
.sent[data-color="green"]{background:linear-gradient(transparent 55%,var(--hl-green) 55%)}
.sent[data-color="blue"]{background:linear-gradient(transparent 55%,var(--hl-blue) 55%)}
.sent[data-color="pink"]{background:linear-gradient(transparent 55%,var(--hl-pink) 55%)}
.sent[data-color="purple"]{background:linear-gradient(transparent 55%,var(--hl-purple) 55%)}
.sent[data-color="maroon"]{background:linear-gradient(transparent 55%,var(--hl-maroon) 55%)}
.sent[data-color="brown"]{background:linear-gradient(transparent 55%,var(--hl-brown) 55%)}
.sent[data-color="charcoal"]{background:linear-gradient(transparent 55%,var(--hl-charcoal) 55%)}
.sent.tts-reading{box-shadow:inset 0 0 0 999px var(--reading);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .2s}
.hl-note{margin:6px 0 12px;padding:8px 12px;background:var(--sunk);border-left:3px solid #D9B168;border-radius:6px;font-size:.85em;white-space:pre-wrap;line-height:1.6}
.hl-note[data-color="green"]{border-left-color:#6FAE71}.hl-note[data-color="blue"]{border-left-color:#6C93D1}.hl-note[data-color="pink"]{border-left-color:#E58FA0}.hl-note[data-color="purple"]{border-left-color:#A48AC9}.hl-note[data-color="maroon"]{border-left-color:#8C4A4E}.hl-note[data-color="brown"]{border-left-color:#8A6740}.hl-note[data-color="charcoal"]{border-left-color:#54534E}
.hlsheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.hlsheet-card{background:var(--surface);width:100%;max-width:720px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.hlsheet-title{font-weight:700}
.hlsheet-quote{background:var(--hl-gold);border-radius:8px;padding:10px 12px;font-family:var(--serif);line-height:1.8}
.hlsheet-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hlsheet-label{font-size:.8em;color:var(--muted);min-width:2.5em}
.hlsheet-colors{display:flex;gap:10px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hlswatch.active{border-color:var(--ink)}
.spanrow{display:flex;align-items:center;gap:8px}
.spanbtn{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.spannum{font-size:.85em;color:var(--muted);min-width:3em;text-align:center}
.hl-hint{margin:0;font-size:.78em;color:var(--muted)}
.hlsheet-ta,.chatinput textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical;margin:0}
.hlsheet-ta{min-height:84px}
.hlsheet-acts{display:flex;gap:8px}
.sbtn{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sbtn.danger{color:var(--crit);border-color:var(--crit)}
.readbar{display:flex;flex-direction:column;gap:6px}
.readbtn[data-state="playing"],.readbtn[data-state="loading"]{background:var(--accent)}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.chatctx{align-self:flex-start;font-size:.78em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 12px}
.qs-toggle{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:.82em;font-weight:700}
.qs-panel{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:6px}
.qs-chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.85em;line-height:1.5}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.chatlog.rp{max-height:52vh;overflow:auto;min-height:60px;margin:10px 0}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.8;margin:0;white-space:normal;font-size:1em}
.msg.user{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{background:var(--surface);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin-bottom:0}
.msg.ai h4{margin:12px 0 4px;font-size:1em;color:var(--accent);font-family:var(--serif)}
.msg.ai blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;font-family:var(--serif)}
.msg.ai ul{margin:4px 0 8px;padding-left:20px}.msg.ai li{margin-bottom:4px}
.msg.ai hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.msg.ai .mdtb{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:.88em}
.msg.ai .mdtb th,.msg.ai .mdtb td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.msg.ai .mdtb th{background:var(--sunk)}
.msg .sent{cursor:pointer}
.msg-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.msg-act{border:none;background:transparent;color:var(--muted);font-size:.78em;padding:4px 8px;border-radius:999px}
.msg-act.on{color:var(--accent);font-weight:700}
.chatinput{display:flex;gap:8px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.chatinput textarea{resize:none;max-height:120px}
.chatinput button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.chatnote{margin:0;font-size:.74em}
.msg-q{font-weight:700;font-size:.9em;color:var(--accent);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.msg.col .msg-body{max-height:10.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.msg-more{display:none;border:none;background:none;color:var(--accent);font-size:.82em;font-weight:700;padding:4px 0}
.msg.col .msg-more{display:block}
.hllist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hlitem{display:flex;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hlbar{flex:0 0 5px;border-radius:3px}
.hlmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.hlsrc{font-size:.72em;color:var(--muted)}
.hlt{font-family:var(--serif);line-height:1.7}
.hln{font-size:.82em;background:var(--sunk);border-radius:6px;padding:4px 8px;white-space:pre-wrap}
.updbar{position:fixed;left:0;right:0;top:0;z-index:60;border:none;background:#B98A2E;color:#fff;font-weight:700;font-size:.9em;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.cardpv{background:var(--sunk);border-radius:12px;overflow:hidden;text-align:center}
.cardpv img{max-width:100%;max-height:48vh;display:block;margin:0 auto;-webkit-touch-callout:default;user-select:auto}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.82em;font-weight:500}
.cchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.brandicon{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.homeicon{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
[hidden]{display:none!important}
.bigcode{font-size:2.6em;font-weight:800;letter-spacing:10px;margin:4px 0;color:var(--accent)}
</style></head><body>

/* ---------- 把文字切成一句一句的 span.sent ---------- */
var SKIP = /^(BUTTON|INPUT|TEXTAREA|SCRIPT|STYLE)$/;
var SKIPCLS = /\b(hl-note|msg-actions|msg-q)\b/;

  if (!root) { return; }
  qsa('[data-b]', root).forEach(function (blk) {
    var b = blk.getAttribute('data-b'), s = 0, lastBox = null, open = false;
    var walker = document.createTreeWalker(blk, 4, null, false), nodes = [], n;
    while ((n = walker.nextNode())) { nodes.push(n); }
    nodes.forEach(function (tn) {
      if (!tn.nodeValue || !/\S/.test(tn.nodeValue)) { return; }
      for (var p = tn.parentNode; p && p !== blk.parentNode; p = p.parentNode) {
        if (SKIP.test(p.tagName) || (p.className && SKIPCLS.test(String(p.className)))) { return; }
      }
      var box = tn.parentNode; while (box !== blk && !BLOCKTAG.test(box.tagName)) { box = box.parentNode; }
      if (box !== lastBox) { if (lastBox && open) { s++; } lastBox = box; open = false; }

        sp.textContent = pc; frag.appendChild(sp);

function sendChat(text) {
  text = String(text || '').replace(/^\s+|\s+$/g, '');
  if (!text || chatBusy) { return; }
  var inp = $('chatIn'); if (inp) { inp.value = ''; }
  var lastAi = CHAT.length && CHAT[CHAT.length - 1].role === 'ai' ? CHAT[CHAT.length - 1] : null;
  var contMode = !!lastAi && CONT_RE.test(text);
  if (!contMode) {
    CHAT.push({ role: 'user', text: text, id: newId() });
    CHAT.push({ role: 'ai', text: THINKING, id: newId() });
  }
  chatBusy = true; paintChat();
  var hlMode = !!chatSrc || (contMode && lastAi && lastAi.hl);
  var sys = SYS_ZH + unitContext() + (chatSrc ? '\n讀者畫線的句子：「' + chatSrc.t + '」' : '') +
    (hlMode ? '\n這個問題來自讀者畫線的一段文字。重點是把這一段解釋清楚、回答它的意思，並給小家長一個具體的應用。回答要聚焦、精簡（約 300 到 600 字）。' : '');
  chatSrc = null;
  var msgs = CHAT.filter(function (m) { return m.text !== THINKING; }).slice(contMode ? -13 : -12, contMode ? -1 : undefined).map(function (m) { return { role: m.role === 'user' ? 'user' : 'assistant', content: m.text }; });
  var MAXCONT = hlMode ? (contMode ? 0 : 1) : 6, conts = 0, acc = contMode ? lastAi.text : '';
  var CONT_NOTE = '\n\n*（小智繼續寫……）*';
  var aid = CHAT[CHAT.length - 1].id;
  function show(t) { CHAT[CHAT.length - 1] = { role: 'ai', text: t, id: aid }; paintChat(); }
  if (contMode) { show(acc + CONT_NOTE); }
  function finish(reply, why) {
    var old = CHAT[CHAT.length - 1] || {};
    CHAT[CHAT.length - 1] = { role: 'ai', id: aid, col: old.col, text: reply || ('小智暫時連不上，請確認網路後再試一次。' + (why ? '（' + why + '）' : '')) };
    chatBusy = false; saveChat(); paintChat();
    var box = $('chatIn');
    if (hlMode) { CHAT[CHAT.length - 1].hl = true; saveChat(); }
    if (box && reply && !hlMode && (why || looksCut(reply))) { box.value = CONT_TEXT; toast('回答可能還沒寫完，按「送出」讓小智繼續寫'); }
  }
  function cut(d, r) {
    if (!r) { return false; }
    if (d && typeof d === 'object') {
      if (d.stop_reason === 'max_tokens' || d.finish_reason === 'length') { return true; }
      if (d.choices && d.choices[0] && d.choices[0].finish_reason === 'length') { return true; }
      if (d.stop_reason === 'end_turn' || (d.choices && d.choices[0] && d.choices[0].finish_reason === 'stop')) { return false; }
    }
    var tail = r.replace(/\s+$/, '');
    return tail.length > 600 && looksCut(tail);
  }
  function payload() {
    var m = msgs.slice();
    if (acc) {
      m.push({ role: 'assistant', content: acc.replace(/\s+$/, '') });
      m.push({ role: 'user', content: '你的回答被截斷了。請從剛才停下的地方直接接著寫下去，不要重複已經寫過的內容，也不要加任何開場白。' });
    }
    return m;
  }
  function join(a2, b2) {
    if (!a2) { return b2; }
    b2 = b2.replace(/^\s+/, '');
    for (var n = Math.min(80, b2.length, a2.length); n >= 8; n--) { if (a2.slice(-n) === b2.slice(0, n)) { return a2 + b2.slice(n); } }
    var glue = /[一-鿿]$/.test(a2) || /^[一-鿿]/.test(b2) ? '' : (/\n$/.test(a2) ? '' : ' ');
    return a2 + glue + b2;
  }
  function step() {
    chatReq(sys, payload(), function (r, d, why) {
      if (why) { finish(acc, why); return; }
      if (!r) { finish(acc, acc ? '' : 'empty'); return; }
      var more = cut(d, r) && conts < MAXCONT;
      acc = join(acc, r);
      if (more) { conts++; show(acc + CONT_NOTE); step(); } else { finish(acc); }
    });
  }
  step();
}
function afterChat() {

/* ---------- 版本更新：網站有新版就提醒一鍵更新 ---------- */
var updShown = false;
function checkNewVer(manual) {
  if (updShown || !/^https?:/.test(location.protocol)) { if (manual) toast('目前是最新版'); return; }
  var x = new XMLHttpRequest();
  try { x.open('GET', 'version.json?t=' + Date.now(), true); } catch (e) { return; }
  x.onreadystatechange = function () {
    if (x.readyState !== 4) { return; }
    if (x.status !== 200) { if (manual) toast('無法檢查更新'); return; }
    var v = null; try { v = JSON.parse(x.responseText).v; } catch (e) {}
    if (v && v !== VER) { showUpdate(v); } else if (manual) { toast('目前是最新版 v' + VER); }
  };
  x.send();
}
function showUpdate(v) {

  var d = document.createElement('button');
  d.className = 'updbar'; d.textContent = '有新版本 v' + v + '，點一下立即更新';
  d.onclick = function () {

    var go2 = function () { location.replace(location.pathname + '?v=' + v + location.hash); };
    try {
      var jobs = [];
      if (window.caches && caches.keys) { jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); }

      window.setTimeout(go2, 2500);
    } catch (e) { go2(); }
  };
  document.body.appendChild(d);
}
